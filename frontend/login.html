<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - CryptoRisk AI</title>
</head>
<body>
    <main>
        <h1>Sign in to CryptoRisk AI</h1>
        <button id="google-sign-in" type="button">Continue with Google</button>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = "https://wcowwebrwowbcakngyeg.supabase.co";
        const supabaseAnonKey = "YOUR_SUPABASE_ANON_KEY";
        const supabase = window.supabase.createClient(
            supabaseUrl,
            supabaseAnonKey
        );

        async function loginWithGoogle() {
            const { error } = await supabase.auth.signInWithOAuth({
                provider: "google",
                options: {
                    redirectTo: `${window.location.origin}/dashboard`
                }
            });

            if (error) {
                console.error("Google sign-in failed:", error.message);
            }
        }

        document
            .getElementById("google-sign-in")
            .addEventListener("click", loginWithGoogle);
    </script>
</body>
</html>
