<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - CryptoRisk AI</title>
</head>
<body>
    <main>
        <h1>Sign in to CryptoRisk AI</h1>
        <button id="google-sign-in" type="button">Continue with Google</button>
    </main>

    <script>
        async function loginWithGoogle() {
            window.location.href = "/auth/google";
        }

        document.getElementById("google-sign-in").addEventListener("click", loginWithGoogle);
    </script>
</body>
</html>
