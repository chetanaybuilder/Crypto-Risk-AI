<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | CryptoRisk AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<!-- Authentication page container -->
<div class="auth-page">

    <div class="auth-card">

        <!-- Login form heading -->
        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to continue analyzing cryptocurrencies with AI.
        </p>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="flash {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}

        <form action="{{ url_for('login') }}"
              method="POST">

            <div class="input-group">

                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

            </div>

            <button
                type="submit"
                class="primary-btn full-width">

                Login

            </button>

        </form>

        <div class="auth-footer">

            <p>

                Don't have an account?

                <a href="{{ url_for('register') }}">

                    Create one

                </a>

            </p>

            <p>

                <a href="{{ url_for('home') }}">

                    ← Back to Home

                </a>

            </p>

        </div>

    </div>

</div>

</body>

</html>
