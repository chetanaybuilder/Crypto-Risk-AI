services:
  - type: web
    name: cryptorisk-ai-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cryptorisk-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://cryptorisk-ai-frontend.onrender.com

  - type: static_site
    name: cryptorisk-ai-frontend
    plan: free
    buildCommand: echo "Static frontend ready"
    staticPublishPath: frontend

databases:
  - name: cryptorisk-db
    plan: free
    databaseName: cryptorisk
    user: cryptorisk